name: Build and Release Standalone Linux Binary

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyftpdlib pyasyncore pyasynchat

      - name: Compile Standalone Binary
        run: |
          pyinstaller --noconsole --onefile --name pyftpdlib-gui base.py

      - name: Generate Auto Version Tag
        id: version
        run: |
          DATE_TAG=$(date +'%Y.%m.%d')
          RUN_NUM=${{ github.run_number }}
          VERSION="v${DATE_TAG}.${RUN_NUM}"
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "pyftpdlib-gui ${{ steps.version.outputs.tag }}"
          body: "Automated standalone Linux build compiled via GitHub Actions."
          files: dist/pyftpdlib-gui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
